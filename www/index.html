const kindGrp={s:'stars',b:'bh',n:'nebula',g:'galaxy',r:'snr',x:'exo'},kindName={s:'Stern',b:'Schwarzes Loch',n:'Nebel',g:'Galaxie / Quasar',r:'Supernova / Überrest',x:'Exoplaneten-System'};
const deep=C.map(([n,ra,de,ly,k,c,info,wiki,sn])=>{
 const r=ra*Math.PI/180,d=de*Math.PI/180,dv=new THREE.Vector3(Math.cos(d)*Math.cos(r),Math.sin(d),Math.cos(d)*Math.sin(r));
 const g=new THREE.Group(),isB=k=='b';let sp;
 if(isB){const h=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshBasicMaterial({color:0}));h.scale.setScalar(2.5);g.add(h);
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,7,64),new THREE.MeshBasicMaterial({color:0xff9a3c,side:THREE.DoubleSide,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=Math.PI/2-.4;g.add(ring);g.userData.ring=ring}
 const map=k=='n'||k=='r'?nebTex(c):k=='g'?GAL:GL;
 sp=new THREE.Sprite(new THREE.SpriteMaterial({map,color:isB?0xff9a3c:k=='g'||k=='n'||k=='r'?0xffffff:c,blending:THREE.AdditiveBlending,depthWrite:false}));
 if(k=='g')sp.material.rotation=Math.random()*3;
 sp.scale.setScalar(isB?18:k=='g'?34:k=='n'||k=='r'?28:k=='x'?11:14);g.add(sp);
 grp[kindGrp[k]].add(g);
 const e=addEntry({name:n,type:kindName[k],grp:grp[kindGrp[k]],obj:g,sprite:sp,ly,dv,sn,wiki,size:k=='g'?16:8,info,pos:()=>g.position,real:()=>dv.clone().multiplyScalar(ly*LY)});return e});
// Raumsonden (Positionen und Entfernungen ungefähr)
const P=[
['Voyager 1',172,258.25,12.4,'Entfernteste menschengemachte Sonde (ca. 172 AE), startete 1977 und verließ 2012 die Heliosphäre. Position ungefähr.','Voyager_1'],
['Voyager 2',144,296,-56,'ca. 144 AE entfernt, seit 2018 im interstellaren Raum. Einzige Sonde bei Uranus und Neptun. Position ungefähr.','Voyager_2'],
['New Horizons',64.5,288,-20,'ca. 64 AE entfernt. Pluto-Vorbeiflug 2015, Arrokoth 2019. Position ungefähr.','New_Horizons'],
['James-Webb-Teleskop',0,0,0,'Infrarot-Observatorium am Lagrange-Punkt L2, ~1,5 Mio. km hinter der Erde (von der Sonne aus gesehen), Start Dezember 2021.','James_Webb_Space_Telescope']];
const probes=P.map(([n,au,ra,de,info,wiki])=>{
 const r=ra*Math.PI/180,d=de*Math.PI/180,dv=new THREE.Vector3(Math.cos(d)*Math.cos(r),Math.sin(d),Math.cos(d)*Math.sin(r)),jw=n.startsWith('James');
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GL,color:0xffd24f,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.setScalar(5);grp.probe.add(sp);
 const e=addEntry({name:n,type:'Raumsonde',grp:grp.probe,obj:sp,au,dv,jw,wiki,size:3,info,pos:()=>sp.position,
  real:()=>jw?earth.real().multiplyScalar(1.01):dv.clone().multiplyScalar(au)});return e});
// Hintergrundsterne
{const n=4000,p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();p.set([v.x*5e5,v.y*5e5,v.z*5e5],i*3)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.3,sizeAttenuation:false})))}
// Layout je Maßstab
function layout(){
 const sr=real?4.65:7;sun.scale.setScalar(sr);sunGlow.scale.setScalar(sr*4);sunE.size=sr;
 bodies.forEach(b=>{b.size=RAD(b.km);b.obj.scale.setScalar(b.size)});
 moons.forEach(m=>{m.size=RAD(m.km);m.obj.scale.setScalar(m.size);m.d=real?m.dk/149597.87:m.par.size*(2.4+m.k)});
 orbits.forEach(({o,au})=>{const p=[];for(let i=0;i<=256;i++){const a=i/256*J;p.push(R(au)*Math.cos(a),0,R(au)*Math.sin(a))}o.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3))});
 belts.forEach(b=>{b.A.forEach(o=>{const r=R(o.a);o.p=[r*Math.cos(o.an),o.y*(real?1000:8),r*Math.sin(o.an)];o.sc=o.s*(real?(b.tumble?2:60):(b.tumble?.12:.5))});placeRocks(b,0)});
 deep.forEach(s=>{s.obj.position.copy(s.dv).multiplyScalar((140+35*Math.log10(s.ly))*(real?300:1));s.obj.scale.setScalar(real?300:1)});
 probes.forEach(p=>{if(!p.jw)p.obj.position.copy(p.dv).multiplyScalar(R(p.au));p.obj.scale.setScalar(real?200:1)});
}
layout();
function update(){
 bodies.forEach(b=>{b.th=J*t/b.p+b.ph;const r=R(b.au);b.obj.position.set(r*Math.cos(b.th),0,r*Math.sin(b.th));b.obj.rotation.y+=.002;const rr=b.obj.userData.ring;if(rr){rr.position.copy(b.obj.position);rr.scale.setScalar(b.size)}if(b.obj.userData.cl)b.obj.userData.cl.rotation.y+=.0006});
 moons.forEach(m=>{m.th=J*t/m.pp+m.ph;const pp=m.par.obj.position;m.obj.position.set(pp.x+m.d*Math.cos(m.th),0,pp.z+m.d*Math.sin(m.th))});
 const jw=probes[3],ep=earth.obj.position;jw.obj.position.copy(ep).multiplyScalar(1+(real?10:6)/Math.max(ep.length(),1e-6));
 belts.forEach(b=>b.g.rotation.y=-J*t/b.per);
 deep.forEach(s=>{if(s.obj.userData.ring)s.obj.userData.ring.rotation.z+=.01});
 $('#date').textContent=new Date(Date.UTC(2000,0,1,12)+t*864e5).toLocaleDateString('de-DE')+(playing?'  ·  '+(dir<0?'−':'')+(speed>=365?(speed/365.25)+' J/s':speed+' T/s'):'  ·  Pause');
}
// Supernova-Animation
let sn=null;
function startSN(e){stopSN();const g=new THREE.Group();g.position.copy(e.obj.position);g.scale.setScalar(real?300:1);
 const sh=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));
 const fl=new THREE.Sprite(new THREE.SpriteMaterial({map:GL,color:0xffffff,blending:THREE.AdditiveBlending,depthWrite:false}));
 const rg=new THREE.Mesh(new THREE.RingGeometry(.96,1,96),new THREE.MeshBasicMaterial({color:0x9fd8ff,side:THREE.DoubleSide,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
 g.add(sh,fl,rg);scene.add(g);sn={t0:performance.now(),g,sh,fl,rg,e};e.sprite.visible=false;flyTo(e,60*(real?300:1))}
function stopSN(){if(!sn)return;scene.remove(sn.g);sn.e.sprite.visible=true;sn=null}
function animSN(now){if(!sn)return;const u=(now-sn.t0)/10000,k=Math.min(u,1);
 const r=3+55*Math.pow(k,.55);sn.sh.scale.setScalar(r);sn.sh.material.color.setHSL(.12*(1-k),1,.5+.5*Math.max(0,1-k*3));
 sn.sh.material.opacity=u<1?.9*(1-k*.7):.25;sn.rg.scale.setScalar(r*1.5);sn.rg.lookAt(cam.position);sn.rg.material.opacity=Math.max(0,.9-k);
 sn.fl.scale.setScalar(10+300*Math.exp(-u*7));sn.fl.material.opacity=Math.min(1,u*40)*Math.max(0,1-u*1.2)}
function flyTo(e,dist){follow=e;want=dist||e.size*5;flyUntil=performance.now()+2000}
function frame(now){
 requestAnimationFrame(frame);const dt=Math.min(.1,(now-(frame.l||now))/1000);frame.l=now;
 if(playing)t+=dir*speed*dt;update();if((frame.c=(frame.c||0)+1)%2==0)placeRocks(belts[0],now/1000);
 if(follow){const p=follow.pos(),d=p.clone().sub(controls.target);cam.position.add(d);controls.target.copy(p);
  if(now<flyUntil){const off=cam.position.clone().sub(controls.target),L=off.length();cam.position.copy(controls.target).add(off.setLength(L+(want-L)*Math.min(1,dt*3)))}}
 animSN(now);controls.update();renderer.render(scene,cam);
 const w=innerWidth,h=innerHeight;
 pickables.forEach(e=>{const v=e.pos().clone().project(cam);const vis=flags.names&&e.grp.visible&&v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;e.lab.style.display=vis?'block':'none';if(vis){e.lab.style.left=(v.x+1)/2*w+'px';e.lab.style.top=(1-v.y)/2*h+'px'}})}
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
// Auswahl, Messen, Bilder
function fmt(n){return n>=1e9?(n/1e9).toFixed(2)+' Mrd.':n>=1e6?(n/1e6).toFixed(2)+' Mio.':n>=1000?Math.round(n).toLocaleString('de-DE'):n.toFixed(n<10?3:1)}
function dist(a,b){const au=a.real().distanceTo(b.real()),s=au*499.0048;
 let txt=fmt(au)+' AE · '+fmt(au*AUKM)+' km · Licht: '+(s<120?s.toFixed(1)+' s':s<7200?(s/60).toFixed(1)+' min':s<172800?(s/3600).toFixed(1)+' h':s<31557600?(s/86400).toFixed(1)+' Tage':(s/31557600).toFixed(2)+' Jahre');
 if(au>6000)txt+=' · '+fmt(au/LY)+' Lj';return txt}
const imgC={};
async function wimg(e){if(!e.wiki)return;try{let u=imgC[e.wiki];if(u===undefined){const j=await (await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(e.wiki))).json();u=imgC[e.wiki]=(j.thumbnail&&j.thumbnail.source)||null}
 const el=$('#wimg');if(u&&el&&selected===e){el.src=u;el.style.display='block';$('#wcr').style.display='block'}}catch(_){}}
let selected=null,mLine=null;
function select(e){
 if(measure){if(!mA){mA=e;showInfo('<h3>Messen</h3>Start: <b>'+e.name+'</b><br>Tippe ein zweites Objekt.','');return}
  const r=dist(mA,e);if(mLine)scene.remove(mLine);mLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([mA.pos().clone(),e.pos().clone()]),new THREE.LineBasicMaterial({color:0xffd24f}));scene.add(mLine);
  showInfo('<h3>'+mA.name+' ➜ '+e.name+'</h3>'+r+'<br><small>Planetenbahnen vereinfacht (Kreis), Sterne und Objekte mit Himmelskoordinaten aus Katalogen; Entfernungen ferner Objekte sind Schätzwerte.</small>','');mA=null;return}
 selected=e;
 let btn='<button id="b1">✈ Hinfliegen</button>';if(e.sn)btn+='<button id="b2">💥 Explosion abspielen</button><button id="b3">↺ Reset</button>';
 const ex=e.au>0&&!e.dv?'Abstand zur Sonne: '+e.au+' AE ('+fmt(e.au*AUKM)+' km)':e.ly?'Entfernung: '+fmt(e.ly)+' Lichtjahre':e.dv?'Abstand zur Sonne: ca. '+e.au+' AE':'';
 showInfo('<h3>'+e.name+'</h3><small>'+e.type+'</small><br>'+(e.km&&!e.dv?'Radius: '+fmt(e.km)+' km<br>':'')+(e.p?'Umlauf: '+(e.p>700?(e.p/365.25).toFixed(1)+' Jahre':e.p+' Tage')+'<br>':'')+ex+'<p>'+e.info+'</p><img id="wimg" onerror="this.style.display=\'none\'"><small id="wcr" style="display:none;opacity:.6">Bild: Wikipedia / Wikimedia Commons</small>',btn);
 $('#b1').onclick=()=>flyTo(e,e.size*5*((real&&e.ly)?300:1));if(e.sn){$('#b2').onclick=()=>startSN(e);$('#b3').onclick=stopSN}
 wimg(e)}
function showInfo(h,b){const i=$('#info');i.innerHTML=h+'<div class="row">'+b+'<button id="bx">✕</button></div>';i.style.display='block';$('#bx').onclick=()=>{i.style.display='none';mA=null}}
let down=null;const cv=$('#c');
cv.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()});
cv.addEventListener('pointerup',e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<350){
 let best=null,bd=36;pickables.forEach(p=>{if(!p.grp.visible)return;const v=p.pos().clone().project(cam);if(v.z>1)return;const d=Math.hypot((v.x+1)/2*innerWidth-e.clientX,(1-v.y)/2*innerHeight-e.clientY);if(d<bd){bd=d;best=p}});if(best)select(best)}down=null});
// Bedienung
const flags={names:1};GN.forEach(k=>flags[k]=1);
const chipDef=[['planets','Planeten'],['moons','Monde'],['orbits','Bahnen'],['belt','Asteroiden'],['kuiper','Kuipergürtel'],['stars','Sterne'],['bh','Schwarze Löcher'],['nebula','Nebel'],['galaxy','Galaxien'],['snr','Supernovae'],['exo','Exoplaneten'],['probe','Sonden'],['names','Namen']];
chipDef.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className='on';b.onclick=()=>{flags[k]=!flags[k];b.className=flags[k]?'on':'off';if(grp[k])grp[k].visible=!!flags[k]};$('#chips').appendChild(b)});
function btn(txt,fn,cls){const b=document.createElement('button');b.textContent=txt;b.onclick=()=>fn(b);if(cls)b.className=cls;$('#bar').appendChild(b);return b}
btn('☝ Bewegen',b=>{panMode=!panMode;setTouch();b.textContent=panMode?'☝ Bewegen':'☝ Drehen'},'on');
btn('⏯',()=>playing=!playing);
btn('⟲',()=>{dir=-dir});
[['1 T/s',1],['30 T/s',30],['1 J/s',365.25],['10 J/s',3652.5]].forEach(([n,v])=>btn(n,()=>{speed=v;playing=true}));
btn('📏 Messen',b=>{measure=!measure;mA=null;b.className=measure?'on':'';if(!measure&&mLine){scene.remove(mLine);mLine=null}if(measure)showInfo('<h3>Messen</h3>Tippe zwei Objekte nacheinander.','')});
btn('🔭 Echter Maßstab',b=>{real=!real;b.className=real?'on':'';layout();if(follow)flyTo(follow,follow.size*5)});

requestAnimationFrame(frame);
