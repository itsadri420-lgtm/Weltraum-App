name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App-Icon erzeugen
        continue-on-error: true
        run: |
          mkdir -p assets
          convert -size 1024x1024 xc:'#050818' -fill '#7b4dff' -draw 'circle 512,512 512,330' -fill '#4fd8ff' -draw 'circle 450,450 450,390' -fill none -stroke '#ffd24f' -strokewidth 16 -draw 'ellipse 512,512 400,100 0,360' assets/icon.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#050818' --iconBackgroundColorDark '#050818'
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

